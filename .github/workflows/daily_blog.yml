name: Daily Automated SEO Blog Post

on:
  schedule:
    # Runs every Tuesday and Friday at 8:00 AM EST (13:00 UTC)
    - cron: '0 13 * * 2,5'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Blog Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_blog.py

      - name: Commit and Push New Article to GitHub Pages
        run: |
          git config --global user.name "Solanki SEO Bot"
          git config --global user.email "bot@solankihomes.ca"
          git add blog/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-publish Ottawa Valley SEO blog post" && git push)
